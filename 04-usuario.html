<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>04-usuario</title>
</head>
<body>
    <h1>Trocear el gmail</h1>
    <script>    
        let gmail = prompt("Introduce tu correo electrónico: ").trim();
        let posicion = gmail.indexOf("@");
        if(posicion !== -1){
            let nombreUsu = gmail.substring(0, posicion);
            console.log(nombreUsu);
        }else{
            console.log("No se ha introducido correctamente el gmail.")
        }
    </script>
</body>
</html>
