<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>05-tablaMult</title>
</head>
<body>
    <h1>Tabla de multiplicar</h1>
    <ul id="Tabla"></ul>
<script>    
        let numero = prompt("Introduce el número de la tabla de multiplicar que quieras: ");
        let numMult = Number(numero);

        if (numero === null || numero.trim() === "" || isNaN(numMult) || numMult < 0) {
            console.warn("Debes introducir un número válido");
        } else {
            let htmlLista = "";
            
            for (let i = 0; i <= 10; i++) {
                let resultado = numMult * i;
                let texto = numMult + " x " + i + " = " + resultado;
                
                console.log(texto);
                
                htmlLista += "<li>" + texto + "</li>";
            }
            
            document.getElementById("listaTabla").innerHTML = htmlLista;
        }
    </script>
</body>
</html>
