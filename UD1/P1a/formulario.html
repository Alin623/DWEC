<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia DWEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Academia DAW</a>
        <div class="navbar-nav">
        <a class="nav-link active" href="#">Inicio</a>
        <a class="nav-link" href="#">Cursos</a>
        </div>
    </div>
    </nav>  
    <div class="container my-4">
    <h2>Alta de nuevo alumno</h2>
    
    <form>
        <div class="mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre">
        </div>

        <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico:</label>
        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com">
        </div>

        <div class="mb-3">
        <label for="curso" class="form-label">Curso:</label>
        <select class="form-select" id="curso">
            <option>Desarrollo Web en Entorno Cliente (DWEC)</option>
            <option>Desarrollo Web en Entorno Servidor (DWES)</option>
        </select>
        </div>

        <button type="submit" class="btn btn-primary">Darse de alta</button>
    </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
