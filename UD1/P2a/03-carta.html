<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>03-Carta</title>
</head>
<body>
    <h1>Carta</h1>
    <script>    

        let nombre = prompt("Introduce tu nombre: ").trim();  
        let curso = prompt("Introduce tu curso: ").trim();
        let localidad = prompt("Introduce tu localidad: ").trim();
        let fecha_inicio = prompt("Introduce la fecha de inicio: ").trim();
        let fecha_fin = prompt("Introduce la fecha de fin: ").trim();

        let carta = 
            `Estimado/a ${nombre},
            Bienvenido al curso de ${curso} que se celebrará en la localidad de ${localidad} entre
            las fechas ${fecha_inicio} y ${fecha_fin}. Espero que el curso se desarrolle según sus
            expectativas. Estaremos encantados de atenderle.
            Atentamente,
            La dirección.`

            document.write("<pre>" + carta + "</pre>");
    </script>
</body>
</html>
