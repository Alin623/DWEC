<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>02-hastaMayorDeEdad.html</title>
</head>
<body>
    <h1>Verificación de Edad</h1>
    <div id="mensaje"></div>

    <script>
        let edad;
        do {
            let entrada = prompt("Introduce tu edad (debes ser mayor o igual a 18):");

            if (entrada === null) {
                break;
            }

            edad = Number(entrada);

            if (entrada.trim() === "" || isNaN(edad) || edad < 18) {
                alert("Edad no válida o eres menor de edad. Inténtalo de nuevo.");
            }

        } while (isNaN(edad) || edad < 18);

        if (edad >= 18) {
            document.getElementById("mensaje").innerHTML = "<h2>Bienvenido, eres mayor de edad</h2>";
        }
    </script>
</body>
</html>
