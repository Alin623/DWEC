<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>01-Es Par o Impar</title>
</head>
<body>
    <h1>Comprobación Par / Impar</h1>
    <script>
        let numPedido = prompt("Introduce un número: ");

        if(numPedido === null || numPedido.trim() === "" || isNaN(numPedido)){
            console.warn("Lo que has introducido es incorrecto");
        }else{
            let numero = Number(numPedido);

            if(numPedido % 2 === 0){
                console.log("El número " + numPedido + " es par");
            }else{
                console.log("El número " + numPedido + " es impar");
            }
        }
    </script>
</body>
</html>
